<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-elementos</title>
    <style>
        p::before {
            content: "=>";
            color: red;
            font-weight: bold;
        }

        p::after {
            content: "<=";
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <p>
        <span>Exemplo 1</span>
        <span>Exemplo 2</span>
        <span>Exemplo 3</span>
    </p>
</body>
</html>
