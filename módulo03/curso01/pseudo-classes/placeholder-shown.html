<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        input:placeholder-shown {
            border-color: royalblue;
        }
    </style>
</head>
<body>
    <h1>Pseudo-classes | :placeholder-shown</h1>

    <form>
        <label for="name">Nome completo:</label>
        <input type="text" name="name">
        <br><br>
        <label for="email">E-mail:</label>
        <input type="email" name="emaik" placeholder="name@example.com">
        <br><br>
        <label for="age">Sua idade:</label>
        <input type="number" name="age" value="18" placeholder="Você deve ter 18+ anos">

    </form>
</body>
</html>
