<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
        }

        li:only-child {
            font-weight: bold;
            color: red;
        }

        .exemplo p:only-child {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Pseudo-classes:</h1>
    <br>
    <div>
        <input type="checkbox" name="choice">
        <label for="choice">:only-child</label>
    </div>

    <hr>

    <p>Único item em uma lista</p>
    <ul>
        <li>Item 01</li>
    </ul>
    <p>Vários itens em uma lista</p>
    <ul>
        <li>Item 01</li>
        <li>Item 02</li>
        <li>Item 03</li>
        <li>Item 04</li>
    </ul>

    <div class="exemplo">
        <p>Parágrafo 1</p>
    </div>

    <hr>

    <div class="exemplo">
        <p>Parágrafo 1</p>
        <p>Parágrafo 2</p>
        <p>Parágrafo 3</p>
    </div>
</body>
</html>
