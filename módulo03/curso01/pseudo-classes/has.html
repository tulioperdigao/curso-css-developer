<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
        }

        figure {
            width: 100px;
            height: 100%;
        }

        img {
            width: 100%;
            object-fit: cover;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .gallery figure {
            box-shadow: 0 0 5px 2px lightgray;
        }

        figcaption {
            font-size: 0.75rem;
        }

        .gallery figure:not(:has(figcaption)) {
            border: 1px solid  black;
            border-radius: 4px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1>Pseudo-classes:</h1>
    <br>
    <div style="background-color: transparent;">
        <input type="checkbox" name="choice">
        <label for="choice">:has</label>
    </div>

    <hr>

    <div class="gallery">
        <figure class="image">
            <img width="100" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZQtalUOvY0K1eqW-IifNECnla1ss5WzpMag&s" alt="imagem aleatória">
            <figcaption>Legenda da imagem</figcaption>
        </figure>
        <figure class="image">
            <img width="100" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZQtalUOvY0K1eqW-IifNECnla1ss5WzpMag&s" alt="imagem aleatória">
            <figcaption>Legenda da imagem</figcaption>
        </figure>
        <figure class="image">
            <img width="100" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZQtalUOvY0K1eqW-IifNECnla1ss5WzpMag&s" alt="imagem aleatória">
        </figure>
        <figure class="image">
            <img width="100" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZQtalUOvY0K1eqW-IifNECnla1ss5WzpMag&s" alt="imagem aleatória">
        </figure>
        <figure class="image">
            <img width="100" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZQtalUOvY0K1eqW-IifNECnla1ss5WzpMag&s" alt="imagem aleatória">
            <figcaption>Legenda da imagem</figcaption>
        </figure>
    </div>

</body>
</html>
