<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        button {
            background-color: #0b57d0;
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-weight: bold;
            border: none;
        }

        button:hover {
            cursor: pointer;
            background-color: darkblue;
            box-shadow: 1px 1px 2px black;
        }

        button:active {
            background-color: green;
        }

        a:active {
            color: lime;
            background-color: blue;
            padding: 10px;
        }

        h1:active {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Pseudo-classes | :active</h1>
    <button class="botao">
        Entrar em contato
    </button>
    <br><br>
    <a href="https://google.com.br">Google</a>
</body>
</html>
