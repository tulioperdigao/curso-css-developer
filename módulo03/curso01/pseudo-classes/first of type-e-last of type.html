<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
        }

        article p:first-of-type {
            color: orange;
        }

        article p:last-of-type {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Pseudo-classes:</h1>
    <br>
    <div>
        <input type="checkbox" name="choice">
        <label for="choice">:nth-child</label>
    </div>
    <div>
        <input type="checkbox" name="escolha">
        <label for="escolha">:nth-of-type</label>
    </div>

    <hr>

    <article>
        <div>Eu sou uma div.</div>
        <p>Eu sou o primeiro parágrafo</p>
        <p>Eu sou o segundo parágrafo</p>
        <p>Eu sou o terceiro parágrafo</p>
        <p>Eu sou o último parágrafo</p>
        <span>Eu sou um span</span>
    </article>
</body>
</html>
