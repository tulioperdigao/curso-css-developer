<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        a:link {
            color: lime;
        }

        a:visited {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Pseudo-classes | :link e :visited</h1>

    <a href="https://intagram.com">
        Me siga no Instagram!
    </a>
    <br>
    <a href="https://google.com.br">
        Acesse o Google!
    </a>
</body>
</html>
