<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-elementos</title>
    <style>
        code {
            background-color: lightgray;
        }

        summary::marker {
            content: '☞';
            color: red;
        }

        li::marker {
            content: '➜';
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Pseudo-elemento - <code>::marker</code></h1>
    <p>
        Permite estilizar os tópicos ou números de uma (<code>li</code>) ou então a flecha de um elemento <code>summary</code>.
    </p>
    <details>
        <summary>Propriedades aceitas</summary>
    </details>
    <ul>
        <li>color</li>
        <li>content</li>
        <li>white-space</li>
        <li>font</li>
        <li>animation</li>
        <li>transition</li>
    </ul>
</body>
</html>
