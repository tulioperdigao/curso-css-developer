<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-elementos</title>
    <style>
        code {
            background-color: lightgray;
        }

        input::file-selector-button {
            border: 2px solid red;
            background-color: darkblue;
            color: white;
            border-radius: 20px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Pseudo-elemento - <code>::file-selector-button</code></h1>
    <p>Permite estilizar a seleção de textos no navegador.</p>

    <form>
        <label for="fileUpload">Upload de arquivo</label>
        <input type="file" name="fileUpload">
    </form>
</body>
</html>
