<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEM CSS</title>
    <style>
        :root {
            --bg-body: rgb(34, 34, 34);
            --bg-gradient: linear-gradient(90deg, #d53369 0%, #daae51 100%);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-body);
            text-align: center;
        }

        h1 {
            background: var(--bg-gradient);
            font-size: 5rem;
            background-clip: text;
            -webkit-background-clip: text;
            -ms-background-clip: text;
            color: transparent;
        }

        /* BEM CSS */

        .menu {
            background-color: rgb(30, 30, 30);
        }

        .menu__list {
            margin: 0;
            padding: 24px 0;
        }

        .menu__item {
            display: inline-block;
            color: white;
            margin: 0 16px;
        }

        .menu__link {
            color: white;
            background: var(--bg-gradient);
            padding: 12px 14px;
            border-radius: 4px;
            text-decoration: none;
        }

        .menu__item--active {
            font-weight: bold;
            color: #00d9ff;
        }


    </style>
</head>
<body class="dark-theme">
    <nav class="menu">
        <ul class="menu__list">
            <li class="menu__item menu__item--active">Início</li>
            <li class="menu__item">Sobre nós</li>
            <li class="menu__item">Contato</li>
            <li class="menu__item">
                <a href="https://www.dio.me/sign-in" class="menu__link">Entrar</a>
            </li>
        </ul>
    </nav>
    <h1>Tulio Perdigão</h1>
</body>
</html>
