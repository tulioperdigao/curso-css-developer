<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOCSS</title>
    <style>
        .box-1 {
            width: 100px;
            height: 100px;
        }

        .box-2 {
            width: 200px;
            height: 200px;
        }

        .box-border {
            border: 1px solid #ccc;
            border-radius: 5px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="box-1 box-border">
        Box 1
    </div>
    <div class="box-2 box-border">
        Box 2
    </div>
</body>
</html>
