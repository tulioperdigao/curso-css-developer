<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformações 3D</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(247, 247, 247);

            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            perspective: 300px;
            perspective-origin: top;
            transform-style: preserve-3d;
        }

        .box {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            position: absolute;
            background: linear-gradient(90deg, #d53369 0%, #daae51 100%);
            transform: matrix3d(
                0.469, -0.883, 0, 0,
                0.883, -0.44, 0.927, 0,
                0, -0.927, -0.375, 0,
                0, 0, 50, 1
            )
        }

    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
