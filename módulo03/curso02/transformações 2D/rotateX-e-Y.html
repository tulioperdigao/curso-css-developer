<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformações 2D</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(247, 247, 247);

            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: url(https://admin.panrotas.com.br/media/thumb/cropper/permalink/fix/1200,675/?source=media-files-original/2011/02/28/tam777300er.jpg);
            background-size: cover;
            background-position: center;
            width: 200px;
            height: 200px;
            border-radius: 8px;
        }

        .box:hover {
            transform: rotateX(60deg);
        }

    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
