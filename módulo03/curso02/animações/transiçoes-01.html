<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformações 3D</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(247, 247, 247);

            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            position: absolute;
            background:  #d53369;

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.4rem;
            transition: background-color 1s, transform 1.5s ease 1s;
        }

        .box:hover {
            background-color: rgb(28, 31, 215);
            transform: rotateX(40deg);
        }

    </style>
</head>
<body>
    <div class="box">HEY!</div>
</body>
</html>
